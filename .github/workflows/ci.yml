name: Build and push docker image
on: 
  workflow_dispatch

env: 
  DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
  DOCKERHUB_PASSWORD: ${{secrets.DOCKERHUB_PASSWORD}}
  DOCKERHUB_REPO: ${{vars.DOCKERHUB_REPO}}
     
jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
     - name: checkout code
       uses: actions/checkout@v4
     - name: logging in to dockerhub
       uses: docker/login-action@v3 
       with: 
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_PASSWORD}}
     - name: building the docker image
       run: |
         docker build -t ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }} .
     - name: now tag the image 
       run: | 
        docker tag ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }} -t ${{ vars.DOCKERHUB_REPO }}/claudera:latest
     - name: push docker image
       run: | 
         docker push ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }}
  trivy-image-scan:
    runs-on: ubuntu-latest 
    needs: build
    steps: 
      - name: checkout the code 
        uses: actions/checkout@v4 
      - name: run trivy image scan for simple image 
        uses: aquasecurity/trivy-actions@0.28.0
        with: 
          scan-type: image ## means the docker image
          image-ref: ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }} ## path you want to scan
          format: 'table' ## the output format we expect
          exit-code: "0"
          ignore-unfixed: true 
          vuln-type: os,library
          severity: CRITICAL,HIGH      