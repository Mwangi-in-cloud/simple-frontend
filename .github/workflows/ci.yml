name: Build and push docker image
on: 
  push:
    branches: 
     [main] 

env: 
  DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
  DOCKERHUB_PASSWORD: ${{secrets.DOCKERHUB_PASSWORD}}
  DOCKERHUB_REPO: ${{vars.DOCKERHUB_REPO}}
     
jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
     - name: checkout code
       uses: actions/checkout@v4
     - name: logging in to dockerhub
       uses: docker/login-action@v3 
       with: 
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_PASSWORD}}
     - name: building the docker image
       run: |
         docker build -t ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }} .
     - name: push docker image
       run: | 
         docker push ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }}
  trivy-image-scan:
    runs-on: ubuntu-latest 
    needs: build
    steps: 
      - name: checkout the code 
        uses: actions/checkout@v4 
      - name: run trivy image scan for simple image 
        uses: aquasecurity/trivy-action@0.28.0
        with: 
          scan-type: image ## means the docker image
          image-ref: ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }} ## path you want to scan
          format: 'table' ## the output format we expect
          exit-code: "0"
          ignore-unfixed: true 
          vuln-type: os,library
          severity: CRITICAL,HIGH      
  update-cd-repo:
   runs-on: ubuntu-latest
   needs: trivy-image-scan
   steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global credential.helper store
        echo "https://${{ secrets.REPO_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials

    - name: Clone CD repository
      run: |
        rm -rf gitops
        git clone https://github.com/Mwangi-in-cloud/simple-frontend-CD.git gitops

    - name: Update image tag in deployment file
      working-directory: gitops
      run: |
        sed -i "s|image: ${{ vars.DOCKERHUB_REPO }}/claudera:.*|image: ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }}|g" cd.yml

    - name: Commit and push changes
      working-directory: gitops
      run: |
        git add deployment.yml
        git commit -m "Update image to ${{ github.sha }}" || echo "No changes to commit"
        git push
    
       
    
   
     

        
