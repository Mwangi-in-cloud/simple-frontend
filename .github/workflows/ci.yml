name: Build and push docker image
on: 
  workflow_dispatch

env: 
  DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
  DOCKERHUB_PASSWORD: ${{secrets.DOCKERHUB_PASSWORD}}
  DOCKERHUB_REPO: ${{vars.DOCKERHUB_REPO}}
     
jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
     - name: checkout code
       uses: actions/checkout@v4
     - name: logging in to dockerhub
       uses: docker/login-action@v3 
       with: 
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_PASSWORD}}
     - name: building the docker image
       run: |
         docker build -t ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }} .
     - name: push docker image
       run: | 
         docker push ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }}
  trivy-image-scan:
    runs-on: ubuntu-latest 
    needs: build
    steps: 
      - name: checkout the code 
        uses: actions/checkout@v4 
      - name: run trivy image scan for simple image 
        uses: aquasecurity/trivy-action@0.28.0
        with: 
          scan-type: image ## means the docker image
          image-ref: ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }} ## path you want to scan
          format: 'table' ## the output format we expect
          exit-code: "0"
          ignore-unfixed: true 
          vuln-type: os,library
          severity: CRITICAL,HIGH      
      - name: update-CD-repository 
        shell: bash
        env:
          GIT_TOKEN: ${{secrets.REPO_TOKEN}}
        run: | 
          ## configuring git creds 
          git config --global credential.helper store 
          echo "https://${REPO_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials

          ## remove any repos present 
          rm -rf gitops 
          ## clone our repo to this dir 
          git clone https://github.com/Mwangi-in-cloud/simple-frontend-CD.git gitops
          cd gitops
          sed -i "s|image: ${{ vars.DOCKERHUB_REPO }}/claudera:.*|image: ${{ vars.DOCKERHUB_REPO }}/claudera:${{ github.sha }}|g" deployment.yml

          ## commit the changes
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"

          # push 
          git push -f https://${{REPO_TOKEN}}@github.com/Mwangi-in-cloud/simple-frontend-CD.git@github.com/Mwangi-in-cloud/simple-frontend-CD.git main 
    
   
     

        
